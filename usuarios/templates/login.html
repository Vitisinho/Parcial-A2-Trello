<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Lê a memória do navegador antes de carregar a página
        if (localStorage.getItem('tema') === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
        }
    </script>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm p-4">
                    <h3 class="card-title text-center mb-4">Entrar</h3>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-info p-2 small">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form action="{% url 'login' %}" method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
    <label class="form-label">E-mail</label>
    <input type="email" name="email" class="form-control" placeholder="Insira seu Email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" name="senha" class="form-control" placeholder="Insira sua senha" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Acessar</button>
                    </form>
                    <div class="text-center mt-3">
                        <small>Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Botão Flutuante e Script do Modo Escuro -->
    <button id="btnTema" class="btn btn-dark position-absolute top-0 end-0 m-3 rounded-circle shadow" style="width: 45px; height: 45px; z-index: 1000;">🌙</button>

    <script>
        const btnTema = document.getElementById('btnTema');
        const htmlTag = document.documentElement;

        // Verifica o tema salvo
        if (localStorage.getItem('tema') === 'dark') {
            htmlTag.setAttribute('data-bs-theme', 'dark');
            btnTema.textContent = '☀️';
            btnTema.classList.replace('btn-dark', 'btn-light');
        }

        // Troca o tema ao clicar
        btnTema.addEventListener('click', () => {
            if (htmlTag.getAttribute('data-bs-theme') === 'dark') {
                htmlTag.setAttribute('data-bs-theme', 'light');
                localStorage.setItem('tema', 'light');
                btnTema.textContent = '🌙';
                btnTema.classList.replace('btn-light', 'btn-dark');
            } else {
                htmlTag.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('tema', 'dark');
                btnTema.textContent = '☀️';
                btnTema.classList.replace('btn-dark', 'btn-light');
            }
        });
    </script>

</body>
</html>

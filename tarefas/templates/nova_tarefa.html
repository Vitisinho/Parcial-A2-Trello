<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Tarefa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-4">Adicionar Nova Tarefa</h4>
                    
                    <form action="{% url 'nova_tarefa' %}" method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" name="titulo" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Descrição (Opcional)</label>
                            <textarea name="descricao" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Atribuir para:</label>
                            <select name="atribuida_a" class="form-select">
                                <option value="">Mim mesmo</option>
                                <!-- Faz um loop para listar todos os usuários cadastrados -->
                                {% for usuario in usuarios %}
                                    <option value="{{ usuario.id }}">{{ usuario.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar Tarefa</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Botão Flutuante e Script do Modo Escuro -->
    <button id="btnTema" class="btn btn-dark position-absolute top-0 end-0 m-3 rounded-circle shadow" style="width: 45px; height: 45px; z-index: 1000;">🌙</button>

    <script>
        const btnTema = document.getElementById('btnTema');
        const htmlTag = document.documentElement;

        // Verifica o tema salvo
        if (localStorage.getItem('tema') === 'dark') {
            htmlTag.setAttribute('data-bs-theme', 'dark');
            btnTema.textContent = '☀️';
            btnTema.classList.replace('btn-dark', 'btn-light');
        }

        // Troca o tema ao clicar
        btnTema.addEventListener('click', () => {
            if (htmlTag.getAttribute('data-bs-theme') === 'dark') {
                htmlTag.setAttribute('data-bs-theme', 'light');
                localStorage.setItem('tema', 'light');
                btnTema.textContent = '🌙';
                btnTema.classList.replace('btn-light', 'btn-dark');
            } else {
                htmlTag.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('tema', 'dark');
                btnTema.textContent = '☀️';
                btnTema.classList.replace('btn-dark', 'btn-light');
            }
        });
    </script>
    
</body>
</html>
